name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck core
        run: corepack pnpm typecheck

      - name: Test core
        run: corepack pnpm test

      - name: Typecheck OpenClaw plugin
        run: corepack pnpm --dir openclaw-plugin typecheck

      - name: Test OpenClaw plugin
        run: corepack pnpm --dir openclaw-plugin test
