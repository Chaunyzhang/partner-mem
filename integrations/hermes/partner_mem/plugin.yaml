manifest_version: 1
name: partner_mem
version: 0.1.0
kind: exclusive
description: "Partner-Mem local graph memory with verified raw evidence recall."
external_dependencies:
  - name: node
    version: ">=20"
    check: 'node -e "process.exit(parseInt(process.versions.node, 10) >= 20 ? 0 : 1)"'
    install: "https://nodejs.org/en/download"
provides_tools:
  - partner_mem_search
  - partner_mem_recall
  - partner_mem_timeline
  - partner_mem_status
